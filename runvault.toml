# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` (試行群の平均・アブレーション) と
# `simulation/src/reproduce.rs` (論文の 2 つの主張の照合) が書いているものと
# 一致していなければならない．
#
# `direction` は «どちらが良いか»．網の構造量も到達率も模型の記述であって成績では
# ないので `none` を書く — 「弱い紐帯を切ると到達率が落ちる」は主張であって，
# 到達率が高いほど良いという話ではない．

# --- 試行群の平均 (scope=run) ----------------------------------------------

[metrics."n_agents"]
meaning   = "網の頂点数 (エージェント数)"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_n_edges"]
meaning   = "試行群にわたる辺数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_n_local_bridges"]
meaning   = "試行群にわたる局所橋 (取り除くと両端の距離が 2 を超える辺) の本数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_frac_weak_bridges"]
meaning   = "局所橋のうち弱い紐帯が占める割合の平均．Granovetter の «橋は弱い紐帯である» に対応する"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_forbidden_triad_rate"]
meaning   = "禁止された三つ組 (強い紐帯 2 本を共有しながら両端が繋がっていない組) の出現率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_reach_fraction"]
meaning   = "情報が到達した頂点の割合の平均 (全紐帯を使ったときの基準値)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_reach_strong_only"]
meaning   = "強い紐帯だけを辿ったときの到達頂点数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_reach_weak_only"]
meaning   = "弱い紐帯だけを辿ったときの到達頂点数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_avg_path_length"]
meaning   = "試行群にわたる平均経路長の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_largest_component_fraction"]
meaning   = "最大連結成分が全頂点に占める割合の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_cascade_rounds"]
meaning   = "情報が広がり切るまでに要した伝播ラウンド数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- アブレーション比較 (scope=run) ----------------------------------------

[metrics."mean_baseline_reach_fraction"]
meaning   = "紐帯を除去する前の到達率 (アブレーションの基準)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_ablated_reach_fraction"]
meaning   = "紐帯を除去した後の到達率"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_delta_reach_fraction"]
meaning   = "除去による到達率の変化 (除去後 − 除去前)．負に大きいほど，その紐帯が到達に効いていた"
unit      = "ratio"
direction = "none"
range     = [-1.0, 1.0]
scope     = ["run"]

# --- 論文の主張の照合 (reproduce サブコマンド．scope=run) --------------------

[metrics."baseline_reach"]
meaning   = "全紐帯を使ったときの到達率 (主張 1 の基準)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."weak_removed_reach"]
meaning   = "弱い紐帯を除いたときの到達率．基準より大きく落ちることが «弱い紐帯の強さ» の主張である"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."strong_removed_reach"]
meaning   = "強い紐帯を除いたときの到達率 (弱い紐帯の除去と比べる対照)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."random_removed_reach"]
meaning   = "同数の紐帯を無作為に除いたときの到達率 (もう 1 つの対照)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."frac_weak_bridges"]
meaning   = "局所橋のうち弱い紐帯が占める割合 (この run が主張として出す 1 つの値)"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."theta_low"]
meaning   = "閾値の走査で到達率が低いままの側の端 (相転移の下端)"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."reach_low"]
meaning   = "`theta_low` における到達率"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."theta_high"]
meaning   = "閾値の走査で到達率が高くなった側の端 (相転移の上端)"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."reach_high"]
meaning   = "`theta_high` における到達率"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."transition_width"]
meaning   = "相転移の幅 (`theta_high` − `theta_low`)．狭いほど閾値に対する応答が急である"
unit      = "ratio"
direction = "none"
scope     = ["run"]

# --- 条件（parameters）の説明 -----------------------------------------------
#
# 鍵は JSON ポインタ．`config.json` の `/parameters` からの相対で指す．

[parameters."/clusters"]
meaning = "クラスタ（コミュニティ）の数 K"
unit    = "count"

[parameters."/cluster_size"]
meaning = "1 クラスタあたりのエージェント数"
unit    = "count"

[parameters."/n_agents"]
meaning = "総エージェント数（clusters × cluster_size）"
unit    = "count"

[parameters."/p_strong"]
meaning = "クラスタ内に強い紐帯が張られる確率（ER モデル．1.0 で準クリーク）"
range   = [0.0, 1.0]

[parameters."/p_bridge"]
meaning = "クラスタ対ごとに弱い紐帯の橋が張られる確率"
range   = [0.0, 1.0]

[parameters."/p_weak_intra"]
meaning = "クラスタ内に弱い紐帯を許す確率（連続性の近似．既定 0.0）"
range   = [0.0, 1.0]

[parameters."/diffusion"]
meaning = "拡散モデル．`si` は接触過程（informed が隣接を確率 β で informed 化），`threshold` は Granovetter (1978) の閾値カスケード"

[parameters."/beta"]
meaning = "SI の感染確率 β（diffusion=si のときだけ効く）"
range   = [0.0, 1.0]

[parameters."/theta"]
meaning = "カスケードの閾値 θ（diffusion=threshold のときだけ効く）．informed な隣接の割合がこれ以上で active 化する"
range   = [0.0, 1.0]

[parameters."/remove"]
meaning = "アブレーションで除去する紐帯．`none` / `weak` / `strong` / `random`（弱紐帯と同数を無作為に除く対照群）"

[parameters."/n_seeds"]
meaning = "拡散の起点にするノードの数"
unit    = "count"

[parameters."/max_iterations"]
meaning = "カスケードのラウンド数の上限"
unit    = "count"

[parameters."/runs"]
meaning = "この条件で走らせる独立試行の本数"
unit    = "count"

[parameters."/seed"]
meaning = "試行のシードを派生させる基準の乱数種"

# --- sweep 親のグリッド定義 --------------------------------------------------

[parameters."/p_bridge_min"]
meaning = "sweep が振る橋渡し確率の下端"

[parameters."/p_bridge_max"]
meaning = "sweep が振る橋渡し確率の上端"

[parameters."/p_bridge_step"]
meaning = "橋渡し確率の刻み幅"

[parameters."/theta_values"]
meaning = "sweep が比べる閾値 θ の並び"

# --- reproduce の 2 主張 ------------------------------------------------------
#
# `reproduce` は Claim A（弱紐帯ブリッジ効果）と Claim B（閾値カスケードの
# ティッピング）を 1 本の run で走らせるので，どちらの主張の設定かを名前の
# 後ろの `_a` / `_b` で分けている．同名の設定を 2 つ持てないための綴りであって，
# 意味は `_a` / `_b` の付かないものと同じである．

[parameters."/p_bridge_a"]
meaning = "Claim A（弱紐帯ブリッジ効果）を測るときの橋渡し確率"

[parameters."/runs_a"]
meaning = "Claim A をこの条件で走らせる独立試行の本数"
unit    = "count"

[parameters."/beta_a"]
meaning = "Claim A の SI 拡散における 1 接触あたりの感染確率"

[parameters."/p_bridge_b"]
meaning = "Claim B（閾値カスケードのティッピング）を測るときの橋渡し確率"

[parameters."/runs_b"]
meaning = "Claim B を θ の各点で走らせる独立試行の本数"
unit    = "count"

[parameters."/n_seeds_b"]
meaning = "Claim B のカスケードを起こす初期シード数"
unit    = "count"

[parameters."/quick"]
meaning = "縮小規模で走らせるか（cluster_size と θ グリッドを動作確認用に落とす）"
