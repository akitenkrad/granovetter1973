<!-- granovetter1973 hero. Vault SVG style contract (palette + dark mode). -->
<svg width="100%" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Granovetter 1973 — The Strength of Weak Ties</title>
<desc>Dense clusters of strong ties (grey) are bridged sparsely by weak ties (red dashed). Information seeded in one cluster spreads across the whole network only through the weak-tie bridges; removing the weak ties confines it to a single cluster.</desc>
<style>
  .t  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 14px; fill: #2C2C2A; }
  .tl { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #534AB7; letter-spacing: 2px; }
  .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 28px; font-weight: 600; fill: #2C2C2A; }
  .glab { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.5px; }
  .strong { stroke: #90A4AE; stroke-width: 1.3; opacity: 0.7; }
  .weak { stroke: #E53935; stroke-width: 2; stroke-dasharray: 5 4; opacity: 0.95; }
  .node { fill: #534AB7; }
  .seed { fill: #FFC107; stroke: #333; stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    .t { fill: #E6E4DD; } .title { fill: #F2F0EA; } .glab { fill: #9C9A92; }
    .strong { stroke: #6B7A82; } .node { fill: #8B82E0; }
  }
</style>
<text x="40" y="48" class="tl">SOCIAL NETWORK ANALYSIS</text>
<text x="40" y="84" class="title">The Strength of Weak Ties</text>

<!-- Cluster A (left) — strong-tie clique -->
<g>
  <line class="strong" x1="120" y1="170" x2="180" y2="150"/>
  <line class="strong" x1="120" y1="170" x2="160" y2="210"/>
  <line class="strong" x1="180" y1="150" x2="160" y2="210"/>
  <line class="strong" x1="180" y1="150" x2="210" y2="190"/>
  <line class="strong" x1="160" y1="210" x2="210" y2="190"/>
  <circle class="seed" cx="120" cy="170" r="9"/>
  <circle class="node" cx="180" cy="150" r="7"/>
  <circle class="node" cx="160" cy="210" r="7"/>
  <circle class="node" cx="210" cy="190" r="7"/>
</g>

<!-- Cluster B (middle) -->
<g>
  <line class="strong" x1="420" y1="130" x2="470" y2="170"/>
  <line class="strong" x1="420" y1="130" x2="460" y2="100"/>
  <line class="strong" x1="470" y1="170" x2="460" y2="100"/>
  <line class="strong" x1="470" y1="170" x2="510" y2="140"/>
  <line class="strong" x1="460" y1="100" x2="510" y2="140"/>
  <circle class="node" cx="420" cy="130" r="7"/>
  <circle class="node" cx="470" cy="170" r="7"/>
  <circle class="node" cx="460" cy="100" r="7"/>
  <circle class="node" cx="510" cy="140" r="7"/>
</g>

<!-- Cluster C (right) -->
<g>
  <line class="strong" x1="700" y1="200" x2="750" y2="170"/>
  <line class="strong" x1="700" y1="200" x2="740" y2="240"/>
  <line class="strong" x1="750" y1="170" x2="740" y2="240"/>
  <line class="strong" x1="750" y1="170" x2="790" y2="210"/>
  <line class="strong" x1="740" y1="240" x2="790" y2="210"/>
  <circle class="node" cx="700" cy="200" r="7"/>
  <circle class="node" cx="750" cy="170" r="7"/>
  <circle class="node" cx="740" cy="240" r="7"/>
  <circle class="node" cx="790" cy="210" r="7"/>
</g>

<!-- Weak-tie bridges -->
<line class="weak" x1="210" y1="190" x2="420" y2="130"/>
<line class="weak" x1="510" y1="140" x2="700" y2="200"/>

<text x="290" y="148" class="glab">weak tie (bridge)</text>
<text x="565" y="158" class="glab">weak tie (bridge)</text>
<text x="120" y="255" class="glab">strong-tie cluster</text>
</svg>
