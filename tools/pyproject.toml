[project]
name = "granovetter-tools"
version = "0.1.0"
description = "Granovetter (1973) The Strength of Weak Ties — visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "socsim-tools",
]

[project.scripts]
granovetter-tools = "granovetter_tools.cli:main"

[tool.uv.sources]
socsim-tools = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", subdirectory = "tools/socsim_tools" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/granovetter_tools"]
